# Configuración de turnos — playas jul-sep 2026
# Edita aquí y ejecuta: python3 generar_turnos.py

periodo:
  inicio: "2026-07-01"
  fin: "2026-09-30"

# Días que no se recalculan al ejecutar generar_turnos.py
# - pasado_automatico: conserva hoy y días anteriores (por defecto true)
# - hasta: fija manualmente hasta qué fecha incluir (útil tras editar el CSV)
# Edición manual: cambia turnos_jul_sep_2026.csv; marca bloqueado=1 en días que no quieras recalcular
# Publicar web: python3 generar_vista.py genera turnos.html + docs/ (Pages); luego git push
# Pantallas: Cuadrante (calendario + recuento de extras + checkbox día a día) y docs/agosto.html (público sin extras)
# Columnas admin (mismo CSV):
#   cesantes     — refuerzos: Vacante 2; Esther (varios con ;)
#   vacaciones   — nombres separados por ; (solo manual, el generador no la rellena)
#   horas_extras — Nombre:horas; Nombre:horas (solo manual; checkbox «Mostrar horas extra» + tabla de recuento)
#   bloqueado    — 1 o x: la fila no se toca jamás al regenerar
# Horas extras aún no pagadas (editar a mano; se muestra en el cuadrante, no en agosto público):
horas_pendientes:
  Alejandro: 8
  Claudio: 8
  Fernando: 16

congelado:
  pasado_automatico: true
  hasta: "2026-07-03"

# 4 días trabajan, 2 libran. 3 grupos desfasados.
# Grupo 1 (Esther) desfase 4 → libra el 1 de julio.
rotacion:
  dias_trabajo: 4
  dias_libres: 2
  desfase_grupos: [4, 0, 2]  # grupo 1, 2, 3

# Grupo 1: Esther (pat) + Fernando + Vacante 1
# Grupo 2: Adrián (pat) + Claudio + Alex + Vacante 2
# Grupo 3: Vacante 3 (pat, hueco Pablo) + Robinson + Sergio + Rodrigo
# Plantilla: 12 socorristas + 4 patrones = 16 entradas (Raúl fuera de momento)
# Rober / Aaron: refuerzo por días concretos (solo Cesantes / puestos socorrista)
socorristas:
  - { nombre: "Fernando Franco Martins", grupo: 1 }
  - { nombre: "Arturo", grupo: 1 }
  - { nombre: "Rober", grupo: 1 }
  - { nombre: "Aaron", grupo: 1 }
  - { nombre: "Vacante 1", grupo: 1 }
  - { nombre: "Claudio Pazos González", grupo: 2 }
  - { nombre: "Alejandro Panadeiros Covelo", grupo: 2 }
  - { nombre: "Vacante 2", grupo: 2 }
  - { nombre: "Anxo", grupo: 2 }
  - { nombre: "Robinson Ubaldo Rodríguez De Jesús", grupo: 3 }
  - { nombre: "Sergio Amoedo Domínguez", grupo: 3 }
  - { nombre: "Rodrigo", grupo: 3 }

patrones:
  - { nombre: "Esther Román Figueroa", grupo: 1 }
  - { nombre: "Adrián Bouzón Amoedo", grupo: 2 }
  # - { nombre: "Raúl", grupo: 2 }  # fuera de momento
  - { nombre: "Anxo", grupo: 2 }
  - { nombre: "Vacante 3", grupo: 3 }

# De baja: no entran en rotación; su hueco es la vacante del mismo grupo
baja:
  - nombre: "Pablo Novoa Fernández"
    grupo: 3
    vacante: "Vacante 3"

# Incorporación parcial: solo puede trabajar en estas fechas (resto = no disponible)
disponibilidad:
  Arturo:
    fechas:
      - "2026-07-10"
      - "2026-07-15"
      - "2026-07-16"
      - "2026-07-21"
      - "2026-07-22"
      - "2026-07-27"
      - "2026-07-28"
      - "2026-08-02"
      - "2026-08-03"
      - "2026-08-09"
      - "2026-08-15"
      - "2026-08-20"
      - "2026-08-21"
      - "2026-08-26"
      - "2026-08-27"
  Rober:
    fechas:
      # Empiezan a partir del 13 ago (no días anteriores)
      - "2026-08-16"
      - "2026-08-17"
      - "2026-08-22"
      - "2026-08-28"
      - "2026-08-29"
  Aaron:
    fechas:
      - "2026-08-14"
      - "2026-08-17"
      - "2026-08-20"
      - "2026-08-21"
      - "2026-08-24"
      - "2026-08-27"
      - "2026-08-28"
