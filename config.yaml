  Anxo:
    fines_de_semana: true
  # Raúl:
  #   laborables: true

# Patrón sustituto: cubre cesantes cuando el titular libra (lun–vie; nunca chapela)
# patron_sustituto:
#   Raúl:
#     puesto: patron_cesantes
#     cubre:
#       - "Esther Román Figueroa"
#       - "Adrián Bouzón Amoedo"

# Sustitutos temporales: cada uno cubre una vacante el día que trabaja
sustitutos:
  - "Arturo"
  - "Anxo"
  - "Rober"
  - "Aaron"
  # - "Raúl"

preferencias:
  # G1 trabaja (4/2): Esther patrón Chapela + Fernando socorrista Chapela.
  # G1 libra (2 días): no se asignan; si van de extra, edítalos a mano (puesto + horas_extras).
  patron_chapela:
    - "Esther Román Figueroa"

  pareja_chapela:
    "Esther Román Figueroa": "Fernando Franco Martins"

  # Cuando Esther libra, Robinson/Sergio cubren Chapela (4 días seguidos por bloque)
  socorrista_chapela:
    - "Robinson Ubaldo Rodríguez De Jesús"
    - "Sergio Amoedo Domínguez"

  # Zodiac: solo socorristas (nunca patrones). Alex + Robinson (Claudio lesionado).
  socorrista_zodiac:
    - "Alejandro Panadeiros Covelo"
    - "Robinson Ubaldo Rodríguez De Jesús"

  # Si G2 libra, zodiac lo cubren Sergio/Robinson
  socorrista_zodiac_reserva:
    - "Sergio Amoedo Domínguez"
    - "Robinson Ubaldo Rodríguez De Jesús"

  llave_chapela_patrones:
    - "Esther Román Figueroa"

  # Abrir puesto: preferencia Sergio/Robinson
  llave_cesantes_pool_g2:
    - "Sergio Amoedo Domínguez"
    - "Robinson Ubaldo Rodríguez De Jesús"

  llave_cesantes_pool_g3:
    - "Sergio Amoedo Domínguez"
    - "Robinson Ubaldo Rodríguez De Jesús"

  abrir_torre_pool:
    - "Sergio Amoedo Domínguez"
    - "Robinson Ubaldo Rodríguez De Jesús"
    - "Fernando Franco Martins"

  # Orden normal de asignación: puesto → zodiac → torre.
  # Estos van al último hueco libre en orden inverso: zodiac → torre → puesto.
  # Si no hace falta, quedan en Cesantes (refuerzos por días).
  prioridad_invertida:
    - "Arturo"
    - "Rober"
    - "Aaron"

  # Socorrista y patrón, pero solo se asigna como socorrista (de momento)
  solo_socorrista:
    - "Anxo"

  # Nunca abren puesto (llave Cesantes)
  no_abrir_puesto:
    - "Anxo"
    - "Rober"
    - "Rodrigo"

  # Solo patrón (nunca socorrista)
  # solo_patron:
  #   - "Raúl"

  # Prefieren zodiac; pueden abrir puesto solo si no hay otro disponible
  prefieren_zodiac:
    - "Claudio Pazos González"
    - "Alejandro Panadeiros Covelo"
